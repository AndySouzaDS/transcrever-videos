[project]
name = "script-transcricao-videos-31-08-26"
version = "0.1.0"
description = "Transcrição fiel de áudios de vídeo (.mkv) com Whisper local + revisão via OpenRouter"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "faster-whisper>=1.0.3",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
transcrever = "transcrever.cli:app"
pull-secrets = "transcrever.secrets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcrever"]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
]
